<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="handleGradient" x1="300" y1="300" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="waveFade" cx="210" cy="210" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white"/>
      <stop offset="50%" stop-color="white"/>
      <stop offset="80%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="waveMask">
      <circle cx="210" cy="210" r="100" fill="url(#waveFade)"/>
    </mask>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- Magnifying glass — 2 concentric rings -->
  <circle cx="210" cy="210" r="112" stroke="white" stroke-width="24" fill="none"/>
  <circle cx="210" cy="210" r="150" stroke="white" stroke-opacity="0.3" stroke-width="20" fill="none"/>

  <!-- Handle -->
  <line x1="295" y1="295" x2="420" y2="420" stroke="url(#handleGradient)" stroke-width="32" stroke-linecap="round"/>

  <!-- Audio waveform bars -->
  <g mask="url(#waveMask)">
    <line x1="155" y1="180" x2="155" y2="240" stroke="#FBBF24" stroke-width="16" stroke-linecap="round"/>
    <line x1="178" y1="160" x2="178" y2="260" stroke="#F59E0B" stroke-width="16" stroke-linecap="round"/>
    <line x1="201" y1="145" x2="201" y2="275" stroke="#FDE68A" stroke-width="16" stroke-linecap="round"/>
    <line x1="224" y1="155" x2="224" y2="265" stroke="#F59E0B" stroke-width="16" stroke-linecap="round"/>
    <line x1="247" y1="170" x2="247" y2="250" stroke="#FBBF24" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
